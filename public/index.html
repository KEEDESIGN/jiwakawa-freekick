<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>じわかわフリーキック ⚽</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Single Floating Menu Button (Top Right Corner) -->
    <button id="menu-btn" class="floating-menu-btn" title="メニュー・スコア">
      <span class="menu-icon">⚽</span>
      <span class="menu-streak" id="streak-badge">0</span>
      <span class="menu-gear">⚙️</span>
    </button>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- State Banners -->
    <div id="prompt-banner" class="prompt-banner">
      レッツシュート！<br><small>ボールをゴールへフリック</small>
    </div>

    <div id="result-banner" class="result-banner hidden">
      <div id="result-text" class="result-text">GOAL!!</div>
      <div id="result-sub" class="result-sub"></div>
    </div>

    <!-- Popup Menu Modal (Opens on button tap) -->
    <div id="menu-modal" class="menu-modal hidden">
      <div class="menu-backdrop" id="menu-backdrop"></div>
      <div class="menu-card">
        <div class="menu-card-header">
          <h2 class="menu-title">じわかわフリーキック ⚽</h2>
          <button id="close-menu-btn" class="close-btn" title="閉じる">✕</button>
        </div>

        <div class="menu-stats">
          <div class="stat-box">
            <span class="stat-label">現在の連続ゴール</span>
            <span class="stat-value" id="modal-streak">0</span>
          </div>
          <div class="stat-box best">
            <span class="stat-label">最高記録 (BEST)</span>
            <span class="stat-value gold" id="modal-best">0</span>
          </div>
        </div>

        <div class="menu-buttons">
          <button id="sound-btn" class="modal-action-btn">
            <span id="sound-icon">🔊</span> サウンド: <span id="sound-status">ON</span>
          </button>
          <button id="reset-btn" class="modal-action-btn danger">
            🔄 最初からやり直す
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
