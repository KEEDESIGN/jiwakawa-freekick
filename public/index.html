<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>じわかわフリーキック ⚽ - TOWN SNAP DESIGN PEOPLE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
</head>
<body>
  <!-- Animated Splash Screen (TOWN SNAP Style) -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <img src="assets/logo.png" alt="TOWN SNAP LOGO" class="splash-logo" id="splashLogo">
      <h1 class="splash-title">じわかわフリーキック ⚽</h1>
      <div class="splash-loader">
        <div class="splash-loader-bar" id="splashBar"></div>
      </div>
      <p class="splash-text">Kickoff Loading...</p>
    </div>
  </div>

  <div id="game-container">
    <!-- Single Floating Menu Button (Top Right Corner) -->
    <button id="menu-btn" class="floating-menu-btn" title="メニュー・スコア">
      <span class="menu-icon">⚽</span>
      <span class="menu-streak" id="streak-badge">0</span>
      <span class="menu-gear">⚙️</span>
    </button>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- State Banners -->
    <div id="prompt-banner" class="prompt-banner">
      レッツシュート！<br><small>ボールをゴールへフリック</small>
    </div>

    <div id="result-banner" class="result-banner hidden">
      <div id="result-text" class="result-text">GOAL!!</div>
      <div id="result-sub" class="result-sub"></div>
    </div>

    <!-- OpenSea NFT Pop-art Card Reveal Overlay (Pure Image Card on Goal) -->
    <div class="nft-snap-card-overlay" id="nft-snap-card-overlay">
      <div class="nft-card">
        <div class="nft-card-badge" id="nft-card-badge">GOAL!!</div>
        <img id="nft-card-img" src="" alt="SNAP NFT Artwork" class="nft-card-img">
      </div>
    </div>

    <!-- Footer Credits -->
    <footer class="game-footer-credit">
      <span>© 2026 KEE / TOWN SNAP DESIGN PEOPLE</span>
    </footer>

    <!-- Popup Menu Modal (Opens on button tap) -->
    <div id="menu-modal" class="menu-modal hidden">
      <div class="menu-backdrop" id="menu-backdrop"></div>
      <div class="menu-card">
        <div class="menu-card-header">
          <div class="menu-logo-wrap">
            <img src="assets/logo.png" alt="Logo" class="menu-logo-img">
            <h2 class="menu-title">じわかわフリーキック</h2>
          </div>
          <button id="close-menu-btn" class="close-btn" title="閉じる">✕</button>
        </div>

        <div class="menu-stats">
          <div class="stat-box">
            <span class="stat-label">現在の連続ゴール</span>
            <span class="stat-value" id="modal-streak">0</span>
          </div>
          <div class="stat-box best">
            <span class="stat-label">最高記録 (BEST)</span>
            <span class="stat-value gold" id="modal-best">0</span>
          </div>
        </div>

        <div class="menu-buttons">
          <button id="sound-btn" class="modal-action-btn">
            <span id="sound-icon">🔊</span> サウンド: <span id="sound-status">ON</span>
          </button>
          <a href="/games/" class="modal-action-btn games-link-btn" style="text-decoration:none;color:#fff;">
            <span>🎮</span> GAMES一覧へ
          </a>
          <button id="reset-btn" class="modal-action-btn danger">
            🔄 最初からやり直す
          </button>
        </div>

        <div class="modal-credit-footer">
          <p>Created by <strong>KEE</strong> / <strong>TOWN SNAP DESIGN PEOPLE</strong></p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
